<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    table{
        border: 1px solid black;
        border-collapse: collapse;
        text-align: center;
        max-width: 25%;
    }
    
    .cabecalho{
        background-color: aqua;
    }
</style>
    </head>
    <body>
<table>
    <caption> Trajetória Acadêmica e Profissional</caption>

        </th>
        <th colspan="2">
            Formação
        </th>
        <th rowspan="2">
            Ano de Conclusão
        </th>
    </tr>
    <tr>
        <th>
            Graduação
        </th>
        <th>
            Pós-Graduação
        </th>
        <th> </th>
    </tr>
    <tr>
        <th> José</th>
        <td> Inteligencia Artificial</td>
        <td>Ciencia da Computação</td>
        <td>2023</td>
    </tr>
    <tr>
        <th> Ana</th>
        <td> Engenharia de Software</td>
        <td>Gestão de Projetos</td>
        <td>2022</td>
    </tr>
</table>
    </body>
</html>
