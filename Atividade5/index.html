<!DOCTYPE html>
<html>
    <head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        label{
            display: block;
        }
        form{
            width: 100%;
            max-width: 800px;
            margin:auto;
            padding:10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            box-sizing: border-box;
            border-radius: 10px;
            border: 3px solid aqua;
        }
        input[type=text]{
            width: 50%;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid blue;
            border-radius: 10px;
        }
        input[type=text]:focus{
            background-color: rgb(121, 175, 114);

        }
        input[type=email]{
             box-sizing: border-box;
            border: 1px solid blue;
            border-radius: 10px;
            padding: 10px;
        }
         input[type=button]:hover{
            background-color: rgb(41, 31, 175);
            color: rgb(189, 33, 80);
        }
        input:invalid{
            border: 4px solid red;
        }
    </style>
    </head>
    <body>
        <form autocomplete="on">
<label for="Nome"> Nome</label>
<input type="text" id="Nome" name="NomedoUsuario" value="Nome" 
placeholder="PrimeiroNome SegundoNome" required autofocus><br>

<label for="email"> E-mail</label>
<input type="email" id="email" name="EmailUsuario" value="E-mail" 
placeholder="seuemail@gmail.com"required><br>

<label for="Senha"> Senha </label>
<input type="password" id="Senha" name="SenhaUsuario" value="Senha" 
placeholder="12345" pattern="[0-9]{5}" required><br>

<label for="DataNascimento"> Data de Nascimento</label>
<input type="date" id="DataNascimento" name="Data" value="Data" required><br>

<label for="Curso"> Curso </label>
<input type="radio" id="Software" name="EngenhariadeSoftware" value="Curso" checked>
<label for="Software"> Engeharia de Software</label><br>
<input type="radio" id="Computacao" name="CienciadaComputacao" value="Curso">
<label for="Computacao"> Ciencia da Computacao</label><br>

<label for="Sexo"> Sexo</label>
<select id="Sexo" name="sexos" size="2">
<option value="Masculino"> Masculino</option>
<option value="Feminino"> Feminino</option>
</select>

<label for="Interesses"> Interesses</label>
<input type="checkbox" id="jogar" name="Jogos" value="Jogar" checked>
<label for="jogar"> Jogar</label><br>
<input type="checkbox" id="instrumento" name="Instrumento" value="Instrumento">
<label for="instrumento"> Instrumento</label><br>
<input type="checkbox" id="esportes" name="Esporte" value="esporte">
<label for="esportes"> Esportes</label><br>
<input type="checkbox" id="leitura" name="Ler" value="livros">
<label for="leitura"> Ler </label><br>

<label for="Comentarios"> Comentarios sobre a atividade</label>
<input type="text" id="Comentarios" name="Comentario" value="ComentarioProfessora"
 placeholder="Seu comentario(Maximo de 2000 caracteres)" pattern="[A-Za-z]{2000}" required><br>

 <label for="Foto"> Upload de Foto(.png)</label>
 <input type="file" id="Foto" name="Suafoto" required><br>

 <input type="button" value="Enviar" >
 <input type="button" value="Cancelar">
        </form>

    </body>
</html>
